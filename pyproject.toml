# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-email"
version = "0.0.1"
description = "Native NetBox source of truth for email infrastructure — mail domains, mailboxes, aliases/forwarding, and forwarding relays/smarthosts"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Jameson" }]
keywords = ["netbox", "netbox-plugin", "email", "mail", "smtp", "stalwart", "dkim"]
# PEP 639: the SPDX `license` expression above is authoritative; a `License ::`
# classifier alongside it is rejected by setuptools>=77, so it is intentionally omitted.
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
# Composes netbox-services: MailDomain/MailRelay.service_instance FK its ServiceInstance
# (the Stalwart/mail server), never re-modeling deployment metadata. Hard dependency.
dependencies = ["netbox-services"]

[project.urls]
Repository = "https://github.com/JamesonRGrieve/netbox-email"

[tool.setuptools.packages.find]
include = ["netbox_email*"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netbox.settings"
python_files = ["test_*.py"]
addopts = "-v"
